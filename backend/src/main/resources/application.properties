spring.application.name=citylink_express
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citylink_express?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=root
spring.datasource.password=
# Fresh reads after waiting for row locks must see the previous owner's commit.
# MySQL's default REPEATABLE READ can otherwise preserve a pre-lock snapshot.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jackson.time-zone=Asia/Colombo
server.error.include-message=never
server.error.include-stacktrace=never
app.development=${APP_DEVELOPMENT:true}
app.jwt-secret=${JWT_SECRET:}
app.cors-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}
app.tracking-simulation=${TRACKING_SIMULATION:false}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
